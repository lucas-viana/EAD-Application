spring:
  application:
    name: informatica-basica-server
  threads:
    virtual:
      enabled: true
  datasource:
    # Supabase: use a connection string do "Session pooler" (porta 5432), com sslmode=require.
    # Exemplo: jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:5432/postgres?sslmode=require
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 10000
  flyway:
    schemas: ead
    default-schema: ead
    create-schemas: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ead
        jdbc:
          time_zone: UTC
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  # Endereço público do front-end, usado no link de recuperação enviado por e-mail.
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  # E-mails que recebem o perfil de administração (separados por vírgula).
  admin-emails: ${ADMIN_EMAILS:}
  session:
    cookie-name: ib_session
    ttl: ${SESSION_TTL:P14D}
    cookie-secure: ${COOKIE_SECURE:true}
  password-reset:
    ttl: PT1H
  mail:
    from: ${MAIL_FROM:Informática Básica <nao-responda@informaticabasica.local>}
  media:
    # local: arquivos em MEDIA_DIR servidos por URL assinada; supabase: bucket privado do Supabase Storage.
    video-provider: ${VIDEO_PROVIDER:local}
    local-dir: ${MEDIA_DIR:../media/videos}
    signing-secret: ${MEDIA_SIGNING_SECRET:}
    url-ttl: ${VIDEO_URL_TTL:PT15M}
    supabase-bucket: ${SUPABASE_VIDEO_BUCKET:videos}
  supabase:
    url: ${SUPABASE_URL:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}

logging:
  level:
    br.com.informaticabasica: INFO
